<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic","맑은 고딕",Arial,sans-serif;
    margin: 20px;
    background: #f2f2f2;
    color: #222;
  }
  h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
  .sub { text-align: center; color: #666; margin-bottom: 6px; font-size: 13px; }
  .period-badge {

    margin-bottom: 16px;
    font-size: 14px;
    color: #0057d8;
    font-weight: bold;
  }
  .sync-status {
    display: block;
    text-align: center;
    margin: -6px 0 12px;

  .toolbar button:hover { background: #eee; }
  /* 표 영역 자체를 스크롤 상자로 만들어야 머리글(9월/10월 등, 원재고·입고·현재고·출고)이
     스크롤해도 화면 위에 계속 고정되어 보입니다. (전체 페이지 스크롤에는 sticky가 붙지 않음) */

  .col-code { width: 55px; }
  .col-name { width: 230px; text-align: left !important; white-space: normal; }
  .yearmonth-box { font-size: 12px; text-align: left; line-height: 1.5; }
  .yearmonth-box input {
    width: 70px; border: 1px solid #bbb; text-align: center; font-size: 12px;
  }
  .abbr { font-weight: bold; color: #333; margin-left: 6px; font-size: 10px; }
  /* 잡지 제목 입력칸도 다른 품목명 입력칸과 완전히 같은 굵기/색상(색 없음)으로 표시 */
  .mag-title { width: 220px; margin: 3px 0 0 8px; border: none; border-radius: 0; padding: 3px 6px; font-size: 11px; background: transparent; color: inherit; font-weight: normal; }
  .mag-title.awake-title { border-color: transparent; background: transparent; color: inherit; }
  .mag-title.watchtower-title { border-color: transparent; background: transparent; color: inherit; }
  .mag-title::placeholder { color: #777; font-weight: normal; opacity: 1; }
  .mag-title:focus { background: #fff8d0; outline: 1px solid #f0a500; }
  .mag-extra-controls { display:flex; flex-direction:column; align-items:flex-start; gap:3px; width:100%; }
  .mag-meta-line { display:flex; align-items:center; gap:2px; white-space:nowrap; min-height:20px; }
  .mag-meta-line select, .mag-meta-line input { font-family:inherit; font-size:11px; border:0; border-bottom:1px solid #aaa; border-radius:0; padding:1px 2px; background:transparent; }
  .mag-meta-line select { width:62px; }
  .mag-meta-line .mag-year { width:64px; min-width:64px; text-align:center; font-weight:700; color:#222; }
  .mag-meta-line .mag-year::-webkit-outer-spin-button, .mag-meta-line .mag-year::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .mag-meta-line .mag-year { -moz-appearance:textfield; }
  .mag-meta-line .mag-issue { width:30px; text-align:center; font-weight:normal; color:#222; }
  .mag-extra-title { width:220px; margin-left:8px; border:none; border-radius:0; padding:3px 6px; font-size:11px; background:transparent; color:inherit; font-weight:normal; }
  .mag-extra-title.awake-title { border-color:transparent; background:transparent; color:inherit; }
  .mag-extra-title.watchtower-title { border-color:transparent; background:transparent; color:inherit; }
  .mag-extra-title::placeholder { color:#777; font-weight:normal; opacity:1; }
  .mag-extra-title:focus { background:#fff8d0; outline:1px solid #f0a500; }
  .mag-add-note { color:#1f4e78; font-weight:bold; margin-right:8px; }
  /* 잡지 행은 배경색·글씨색 구분 없이 다른 품목들과 완전히 같게 표시 */
  tr.magazine-row.awake-row td.col-name > span:first-child { color: inherit; font-weight: normal; }
  tr.magazine-row.watchtower-row td.col-name > span:first-child { color: inherit; font-weight: normal; }
  tr.section td {
    background: #d9d9d9; font-weight: bold; text-align: left; font-size: 12px; padding-left: 8px;
  }
  tr.placeholder td.col-name input, tr.extra td.col-name input, tr.extra td.col-code input {
    width: 100%; border: none; background: transparent; font-style: italic; color: #555;
    font-size: 11px; font-family: inherit; padding: 2px 0; margin: 0;
    -webkit-appearance: none; appearance: none; outline: none; box-shadow: none;
    font-weight: inherit; line-height: inherit; -webkit-text-fill-color: currentColor;
  }
  /* 새로 입력한 품목명은 기존 품목명과 완전히 같은 굵기/색상으로 표시 */
  tr.extra td.col-name input, tr.extra td.col-code input { font-style: normal; color: inherit; font-weight: normal; }
  tr.extra td.col-name button { font-size: 11px; }
  /* 재목을 직접 수정할 수 있는 고정 품목: 평소엔 일반 글자처럼 보이고 클릭하면 수정 가능 */
  .item-name-input {
    width: 100%; border: none; background: transparent; font-style: normal; color: inherit;
    font-size: inherit; font-family: inherit; padding: 2px 0; margin: 0;
    -webkit-appearance: none; appearance: none; outline: none; box-shadow: none;
    font-weight: inherit; line-height: inherit; -webkit-text-fill-color: currentColor;
  }
  .item-name-input:focus { background: #fff8d0; outline: 1px solid #f0a500; }
  .data-cell input {
    width: 46px; border: none; background: #d9d9d9; text-align: center; font-size: 11px; padding: 2px 0;
  }
  .data-cell input:focus { background: #fff8d0; outline: 1px solid #f0a500; }
  .data-cell input.computed {
    background: #eaf1ff !important;
    color: #1a4fa0;
    font-weight: bold;
  }
  .data-cell input.computed:focus { outline: none; }
  /* 현재고 칸은 한눈에 보이도록 항상 빨간색 글씨로 표시 */
  .data-cell input.current-stock {
    color: #c0392b;
    font-weight: bold;
  }
  .data-cell input.current-stock:focus { color: #c0392b; }
  tr.section .data-cell, tr.section td { background: #d9d9d9; }
  tr.add-row-btn td { background: #f5f9ff; padding: 4px; }
  tr.add-row-btn button {

  }
  tr.add-row-btn button:hover { background: #dcebff; }
  tr.extra td.del-cell button {
    border: none; background: none; color: #c0392b; cursor: pointer; font-size: 12px;
  }
  /* 현재 기간 강조 */
  th.active-period {
    background: #cfe2ff !important;
    color: #0057d8 !important;
  }
  footer { text-align: center; margin-top: 10px; font-size: 11px; color: #666; }

  .cycle-box { font-size: 14px; text-align: center; margin-bottom: 8px; }
  .cycle-box select { font-size: 14px; padding: 4px 8px; }


  /* ===== 휴대폰 · 태블릿 최적화 ===== */
  html { -webkit-text-size-adjust: 100%; }
  button, input, select { touch-action: manipulation; }
  .mobile-hint { display:none; text-align:center; font-size:12px; color:#555; margin:0 0 8px; }
  .table-wrap { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }

  /* 화면에서 머리글과 왼쪽 2개 열을 고정해 작은 화면에서도 품목을 놓치지 않게 함 */
  @media screen {
    #invTable thead th { position: sticky; top: 0; z-index: 6; }
    #invTable th.col-code, #invTable td.col-code {
      position: sticky; left: 0; z-index: 4; background:#fff;
      min-width:58px; max-width:58px;
    }
    #invTable th.col-name, #invTable td.col-name {
      position: sticky; left: 58px; z-index: 3; background:#fff;
    }
    #invTable thead th.col-code, #invTable thead th.col-name { z-index: 9; background:#e6e6e6; }
    #invTable tr.section td { position:static !important; }
    #invTable tr.placeholder td.col-name { background:#fff; }
    #invTable tr.extra td.col-name, #invTable tr.extra td.col-code { background:#fff; }
  }

  /* 태블릿 */
  @media screen and (max-width: 1024px) {
    body { margin:12px; }
    h1 { font-size:22px; }
    .sub { font-size:13px; }
    .period-badge { font-size:13px; margin-bottom:10px; }
    .mobile-hint { display:block; }
    .toolbar { gap:8px; margin-bottom:10px; }
    .toolbar button { min-height:42px; padding:9px 14px; font-size:14px; }
    .cycle-box { font-size:14px; }
    .cycle-box select { min-height:40px; font-size:14px; }
    .table-wrap { padding:5px; border-radius:8px; }
    table { min-width:1380px; font-size:12px; }
    th, td { padding:5px 4px; }
    .col-name { width:260px; min-width:260px; }
    .data-cell input { width:52px; min-height:34px; font-size:13px; }
    .mag-title, .mag-extra-title { width:235px; min-height:36px; font-size:12px; }
    .mag-meta-line select, .mag-meta-line input { min-height:34px; font-size:12px; }
    .mag-meta-line select { width:70px; }
    .mag-meta-line .mag-year { width:70px; min-width:70px; }
    .mag-meta-line .mag-issue { width:38px; }
    tr.add-row-btn button { min-height:38px; font-size:12px; padding:6px 12px; }
  }

  /* 휴대폰 */
  @media screen and (max-width: 600px) {
    body { margin:6px; background:#fff; }
    h1 { font-size:20px; margin-top:6px; }
    .sub { font-size:12px; }
    .period-badge { font-size:12px; line-height:1.4; margin-bottom:8px; }
    .cycle-box { display:flex; flex-direction:column; align-items:center; gap:5px; margin-bottom:10px; }
    .cycle-box select { width:min(100%, 330px); min-height:44px; font-size:15px; }
    .toolbar { display:grid; grid-template-columns:1fr 1fr; gap:7px; width:100%; margin-bottom:9px; }
    .toolbar button { width:100%; min-height:46px; padding:8px 6px; font-size:14px; font-weight:700; }
    .mobile-hint { display:block; font-size:11px; line-height:1.4; padding:6px 8px; background:#f3f7fb; border-radius:6px; }
    .table-wrap { margin:0; padding:2px; border-left:0; border-right:0; border-radius:0; }
    table { min-width:1150px; font-size:11px; }
    th, td { padding:4px 3px; }
    #invTable th.col-code, #invTable td.col-code { min-width:54px; max-width:54px; left:0; }
    #invTable th.col-name, #invTable td.col-name { left:54px; }
    .col-name { width:130px; min-width:130px; max-width:130px; font-size:11px; }
    .yearmonth-box { font-size:12px; }
    .yearmonth-box input { width:66px; min-height:34px; font-size:13px; }
    .data-cell input { width:48px; min-height:36px; font-size:14px; }
    .mag-title, .mag-extra-title { width:100%; min-width:0; min-height:38px; margin-left:0; font-size:11px; padding:4px 5px; }
    .mag-extra-controls { gap:4px; }
    .mag-meta-line { min-height:38px; gap:3px; flex-wrap: wrap; }
    .mag-meta-line select, .mag-meta-line input { min-height:36px; font-size:13px; }
    .mag-meta-line select { width:72px; }
    .mag-meta-line .mag-year { width:72px; min-width:72px; }
    .mag-meta-line .mag-issue { width:40px; }
    .abbr { font-size:10px; }
    tr.add-row-btn td { padding:7px; }
    tr.add-row-btn button { min-height:42px; font-size:13px; padding:7px 12px; }
    tr.extra td.col-name button { min-width:34px; min-height:34px; font-size:15px; }
  }

  @media print {
    body { background: #fff; margin: 0; }
    .toolbar, .cycle-box { display: none; }
    tr.add-row-btn { display: none; }
    .table-wrap { border: none; padding: 0; overflow: visible; max-height: none; }
    table {
      font-size: 7px;
      min-width: 0;
      width: 100%;
      table-layout: fixed;
    }
    th, td { padding: 1px 2px; }
    .col-code { width: 26px; }
    .col-name { width: 95px !important; white-space: normal; font-size: 7px; }
    .data-cell input, tr.extra td.col-name input, tr.extra td.col-code input {
      width: 100%; font-size: 7px; padding: 0;
    }
    .abbr { font-size: 6px; }
    .data-cell input { background: #eee !important; }
    th.active-period { background: #cfe2ff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: landscape; margin: 6mm; }
  }
</style>
</head>

<h1>재고 조사 목록</h1>
<div class="sub">S-28-KO 양식 기준 · 경주동부 회중</div>

<span class="sync-status" id="syncStatus">🔄 연결 중...</span>

<div class="cycle-box">

<div class="table-wrap">

</div>

function updateSyncStatus(text, cls) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = text;
  el.classList.remove('ok', 'warn');
  if (cls) el.classList.add(cls);
}

function scheduleCloudPush() {
  if (applyingRemote) return; // 원격 데이터를 반영하는 중이면 다시 쏘지 않음
  updateSyncStatus('🔄 저장 중...');
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 800);
}

function pushToCloud() {
  const payload = {
    saved: loadSaved(),
    extra: loadExtra(),
    year: localStorage.getItem(YEAR_KEY) || '',
    cycle: localStorage.getItem(CYCLE_KEY) || '9',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  cloudDocRef.set(payload)
    .then(() => updateSyncStatus('☁ 동기화 완료', 'ok'))
    .catch((err) => {
      console.warn('클라우드 저장 실패:', err);
      updateSyncStatus('⚠ 오프라인 (이 기기에만 저장됨)', 'warn');
    });
}

function applyRemoteData(data) {
  applyingRemote = true;
  saveSaved(data.saved || {});
  saveExtra(data.extra || []);
  const yEl = document.getElementById('ymYear');
  if (data.year !== undefined) {
    localStorage.setItem(YEAR_KEY, data.year);
    if (yEl) yEl.value = data.year;
  }
  if (data.cycle !== undefined) {
    localStorage.setItem(CYCLE_KEY, data.cycle);
    cycleSelect.value = data.cycle;
  }
  applyCycle(cycleSelect.value);
  buildTable();
  applyingRemote = false;
}

function initCloudSync() {
  cloudDocRef.onSnapshot((snap) => {
    if (!firstSnapshotHandled) {
      firstSnapshotHandled = true;
      if (snap.exists) {
        applyRemoteData(snap.data());
      } else {
        pushToCloud(); // 클라우드에 아직 데이터가 없으면 지금 값으로 최초 생성
      }
      updateSyncStatus('☁ 연결됨', 'ok');
      return;
    }
    if (snap.metadata.hasPendingWrites) return; // 방금 내가 쓴 내용 echo는 무시
    if (snap.exists) {
      applyRemoteData(snap.data());
      updateSyncStatus('☁ 다른 기기에서 업데이트됨', 'ok');
    }
  }, (err) => {
    console.warn('Firestore 연결 오류:', err);
    updateSyncStatus('⚠ 오프라인 (이 기기에만 저장됨)', 'warn');
  });
}

function numOrZero(v) {
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function recomputeRow(inputs) {
  const num = numOrZero;
  let prevCur = 0;
  let prevCurSet = false;

  // 첫 번째 기간 (원재고 직접 입력)
  const p0HasData = [0, 1, 2].some(i => inputs[i].value !== '');
  if (p0HasData) {
    const open0 = num(inputs[0].value);
    const in0 = num(inputs[1].value);
    const cur0 = num(inputs[2].value);
    inputs[3].value = open0 + in0 - cur0;
    prevCur = cur0;
    prevCurSet = true;
  } else {
    inputs[3].value = '';
  }

  // 이후 기간 (원재고 = 이전 기간의 현재고)
  for (let p = 1; p < 6; p++) {
    const base = 4 + (p - 1) * 3;
    const pHasData = [base, base + 1].some(i => inputs[i].value !== '');
    if (pHasData) {
      const inP = num(inputs[base].value);
      const curP = num(inputs[base + 1].value);
      const opening = prevCurSet ? prevCur : 0;
      inputs[base + 2].value = opening + inP - curP;
      prevCur = curP;
      prevCurSet = true;
    } else {
      // 해당 기간에 입력이 없으면 출고도 공란으로 두고,
      // 다음 기간을 위해 마지막으로 확인된 현재고는 그대로 유지한다.
      inputs[base + 2].value = '';
    }
  }
}

function makeDataInputs(tr, keyPrefix, defaults) {
  const saved = loadSaved();
  const inputs = [];
  for (let c = 0; c < COLS_PER_ROW; c++) {
    const td = document.createElement('td');
    td.className = 'data-cell';
    const input = document.createElement('input');
    input.type = 'text';
    const isOutput = (c >= 3 && (c - 3) % 3 === 0); // 출고 칸: 3,6,9,12,15,18
    const isCurrent = (c >= 2 && (c - 2) % 3 === 0); // 현재고 칸: 2,5,8,11,14,17
    const key = keyPrefix + '-' + c;
    const savedVal = saved[key];
    input.value = (savedVal !== undefined) ? savedVal : (defaults && defaults[c] !== undefined ? defaults[c] : '');

    if (isCurrent) input.classList.add('current-stock');

    if (isOutput) {
      input.readOnly = true;
      input.classList.add('computed');
      input.title = '자동 계산: 원재고+입고-현재고 (이전 기간 현재고가 다음 기간 원재고로 사용됨)';
    } else {
      input.addEventListener('input', () => {
        const s = loadSaved();
        if (input.value === '') { delete s[key]; } else { s[key] = input.value; }
        saveSaved(s);
        recomputeRow(inputs);
        const outKeys = [3,6,9,12,15,18];
        const s2 = loadSaved();
        outKeys.forEach(i => {
          const k2 = keyPrefix + '-' + i;
          if (inputs[i].value === '') { delete s2[k2]; } else { s2[k2] = inputs[i].value; }
        });
        saveSaved(s2);
      });
    }
    td.appendChild(input);
    tr.appendChild(td);
    inputs.push(input);
  }
  recomputeRow(inputs);
  return inputs;
}

    '파수대 2018년 제2호': '우리의 미래를 알 수 있습니까?',
    '파수대 2018년 제3호': '하느님은 내게 관심이 있으실까?',
    '파수대 2019년 제1호': '하느님은 누구인가?',
    '파수대 2019년 제2호': '더 사는 게 의미가 있을까?',
    '파수대 2019년 제3호': '이렇게 살다 죽는 게 삶의 전부인가?',
    '파수대 2020년 제1호': '진리—찾을 수 있는가?',
    '파수대 2020년 제2호': '하느님의 나라는 어떤 나라입니까?',
    '파수대 2020년 제3호': '사랑의 하느님께서 베푸시는 축복',
    '파수대 2021년 제1호': '기도가 도움이 될까?',
    '파수대 2021년 제2호': '곧 우리 앞에 펼쳐질 더 나은 세상',
    '파수대 2021년 제3호': '더 나은 미래—어떻게 누릴 수 있습니까?',
    '파수대 2022년 제1호': '증오의 악순환에서 벗어나려면',
    '파수대 2023년 제1호': '정신 건강—성경이 도움이 될 수 있다',
    '파수대 2024년 제1호': '믿을 만한 지침—어디에서 찾을 수 있을까?',
    '파수대 2025년 제1호': '모든 전쟁이 끝날 때가 올 것인가?',
    '파수대 2026년 제1호': '평화로운 세상은 꿈에 불과합니까?'
  };

  function isFixedMagazine(row) {
    return row && row.t === 'I' && (row.name.startsWith('깨어라 ') || row.name.startsWith('파수대 '));
  }

  function magazineInfo(name) {
    const m = String(name || '').match(/^(깨어라|파수대)\s+(\d{4})년\s+제(\d+)호/);
    return m ? {type:m[1], year:parseInt(m[2],10), issue:parseInt(m[3],10)} : null;
  }

  function magSort(a, b) {
    // 깨어라 먼저, 파수대 다음 / 각 잡지는 오래된 연도부터 자동 정렬
    const typeOrder = {'깨어라':0, '파수대':1};
    const ta = typeOrder[a.type] ?? 9, tb = typeOrder[b.type] ?? 9;
    if (ta !== tb) return ta - tb;
    if ((a.year || 0) !== (b.year || 0)) return (a.year || 0) - (b.year || 0);
    return (a.issue || 0) - (b.issue || 0);
  }

  function renderFixedRow(row, rIdx) {
    const tr = document.createElement('tr');
    const tdCode = document.createElement('td');
    tdCode.className = 'col-code';
    tdCode.textContent = row.code || '';
    tr.appendChild(tdCode);

    const tdName = document.createElement('td');
    tdName.className = 'col-name';
    const isMagazine = isFixedMagazine(row);
    if (isMagazine) {
      tr.classList.add('magazine-row');
      tr.classList.add(row.name.startsWith('파수대 ') ? 'watchtower-row' : 'awake-row');
      const base = document.createElement('span');
      base.textContent = row.name;
      tdName.appendChild(base);
      if (row.abbr) {
        const ab = document.createElement('span');
        ab.className = 'abbr';
        ab.textContent = row.abbr;
        tdName.appendChild(ab);
      }
      const titleInput = document.createElement('input');
      titleInput.className = 'mag-title ' + (row.name.startsWith('파수대 ') ? 'watchtower-title' : 'awake-title');
      titleInput.placeholder = '잡지 제목 입력';
      const titleKey = 'magTitle-' + rIdx;
      titleInput.value = (savedAll[titleKey] !== undefined)
        ? savedAll[titleKey]
        : (DEFAULT_MAG_TITLES[row.name] || '');
      titleInput.addEventListener('input', () => {
        const s = loadSaved();
        if (titleInput.value === '') delete s[titleKey]; else s[titleKey] = titleInput.value;
        saveSaved(s);
      });
      tdName.appendChild(titleInput);
    } else if (row.editableName) {
      const nameKey = 'itemName-' + rIdx;
      const itemNameInput = document.createElement('input');
      itemNameInput.className = 'item-name-input';
      itemNameInput.value = (savedAll[nameKey] !== undefined) ? savedAll[nameKey] : row.name;
      itemNameInput.addEventListener('input', () => {
        const s = loadSaved();
        if (itemNameInput.value === '') delete s[nameKey]; else s[nameKey] = itemNameInput.value;
        saveSaved(s);
      });
      tdName.appendChild(itemNameInput);
      if (row.abbr) {
        const ab = document.createElement('span');
        ab.className = 'abbr';
        ab.textContent = row.abbr;
        tdName.appendChild(ab);
      }
    } else {
      tdName.innerHTML = row.name + (row.abbr ? '<span class="abbr">' + row.abbr + '</span>' : '');
    }
    tr.appendChild(tdName);
    makeDataInputs(tr, 'r' + rIdx, row.values);
    tbody.appendChild(tr);
  }

  function renderMagazineExtra(ex) {
    const tr = document.createElement('tr');
    tr.className = 'extra magazine-row';

    const tdCode = document.createElement('td');
    tdCode.className = 'col-code';
    tdCode.textContent = '';
    tr.appendChild(tdCode);

    const tdName = document.createElement('td');
    tdName.className = 'col-name';
    const wrap = document.createElement('div');
    wrap.className = 'mag-extra-controls';
    const metaLine = document.createElement('div');
    metaLine.className = 'mag-meta-line';

    const typeSel = document.createElement('select');
    ['깨어라','파수대'].forEach(v => {
      const o=document.createElement('option'); o.value=v; o.textContent=v; typeSel.appendChild(o);
    });
    const typeKey='magType-'+ex.id;
    typeSel.value=savedAll[typeKey] || '깨어라';

    const yearInput=document.createElement('input');
    yearInput.className='mag-year'; yearInput.type='text'; yearInput.inputMode='numeric'; yearInput.maxLength=4;
    yearInput.placeholder='연도';
    const yearKey='magYear-'+ex.id; yearInput.value=savedAll[yearKey] || '';

    const yearText=document.createElement('span'); yearText.textContent='년';
    const issueInput=document.createElement('input');
    issueInput.className='mag-issue'; issueInput.type='number'; issueInput.min='1'; issueInput.max='99';
    issueInput.placeholder='호';
    const issueKey='magIssue-'+ex.id; issueInput.value=savedAll[issueKey] || '';
    const issueText=document.createElement('span'); issueText.textContent='호';

    const abbrSpan=document.createElement('span');
    abbrSpan.className='abbr';

    const titleInput=document.createElement('input');
    titleInput.className='mag-extra-title'; titleInput.placeholder='잡지 제목 입력';
    const titleKey='magExtraTitle-'+ex.id; titleInput.value=savedAll[titleKey] || '';

    function applyMagazineColor() {
      const isWatchtower = typeSel.value === '파수대';
      titleInput.classList.toggle('watchtower-title', isWatchtower);
      titleInput.classList.toggle('awake-title', !isWatchtower);
      tr.classList.toggle('watchtower-row', isWatchtower);
      tr.classList.toggle('awake-row', !isWatchtower);
      const y = String(yearInput.value || '').trim();
      const i = String(issueInput.value || '').trim();
      if (y && i) {
        const yy = y.length >= 2 ? y.slice(-2) : y;
        abbrSpan.textContent = (isWatchtower ? 'wp' : 'g') + yy + '.' + i;
      } else { abbrSpan.textContent = ''; }
    }
    applyMagazineColor();

    const delBtn=document.createElement('button');
    delBtn.textContent='✕'; delBtn.title='이 잡지 삭제'; delBtn.style.marginLeft='4px';
    delBtn.onclick=()=>removeExtraRow(ex.id);

    // 연도·호가 다 채워지면, 기존에 이미 등록되어 있던 잡지들과 완전히 같은 모양(고정 글자 + 제목 칸)으로
    // 보이게 하고, 선택 상자/연도/호/삭제 칸은 숨깁니다. 표시된 글자를 탭하면 다시 수정할 수 있습니다.
    const baseSpan = document.createElement('span');
    const displayLine = document.createElement('div');
    displayLine.style.cursor = 'pointer';
    displayLine.title = '탭하면 종류·연도·호를 다시 수정할 수 있습니다';
    displayLine.appendChild(baseSpan);
    displayLine.addEventListener('click', () => { magEditIds.add(ex.id); buildTable(); });

    function isEntryComplete() {
      return Boolean(String(yearInput.value||'').trim() && String(issueInput.value||'').trim() && titleInput.value.trim());
    }
    function refreshDisplayLabel() {
      const y = String(yearInput.value || '').trim();
      const i = String(issueInput.value || '').trim();
      baseSpan.textContent = typeSel.value + (y ? ' ' + y + '년' : '') + (i ? ' ' + i + '호' : '');
    }
    refreshDisplayLabel();

    function commitAndCollapse() {
      magEditIds.delete(ex.id);
      buildTable();
    }
    function saveField(key, value) {
      const s=loadSaved();
      if (value === '') delete s[key]; else s[key]=value;
      saveSaved(s);
    }
    typeSel.addEventListener('change',()=>{saveField(typeKey,typeSel.value); applyMagazineColor(); refreshDisplayLabel(); commitAndCollapse();});
    yearInput.addEventListener('input',()=>{yearInput.value=yearInput.value.replace(/\D/g,'').slice(0,4); saveField(yearKey,yearInput.value); applyMagazineColor(); refreshDisplayLabel();});
    yearInput.addEventListener('change',commitAndCollapse);
    issueInput.addEventListener('input',()=>{saveField(issueKey,issueInput.value); applyMagazineColor(); refreshDisplayLabel();});
    issueInput.addEventListener('change',commitAndCollapse);
    titleInput.addEventListener('input',()=>{saveField(titleKey,titleInput.value);});
    titleInput.addEventListener('change',commitAndCollapse);

    // 조립: 우선 편집 칸(select/연도/호/삭제) 기준 위치에 abbr을 넣어 두고,
    // 완료된 상태라면 마지막에 표시용 줄로 옮깁니다.
    metaLine.append(typeSel, yearInput, yearText, issueInput, issueText, abbrSpan, delBtn);
    wrap.append(displayLine, metaLine, titleInput);
    tdName.appendChild(wrap);
    tr.appendChild(tdName);
    makeDataInputs(tr, 'extra-' + ex.id, null);
    tbody.appendChild(tr);

    const showEdit = magEditIds.has(ex.id) || !isEntryComplete();
    metaLine.style.display = showEdit ? '' : 'none';
    displayLine.style.display = showEdit ? 'none' : '';
    if (!showEdit) { displayLine.appendChild(abbrSpan); }
    // 편집 칸이 보이는 동안에는 이름이 비어 있을 때만 X(삭제) 표시
    delBtn.style.display = isEntryComplete() ? 'none' : '';
  }

  data.forEach((row, rIdx) => {
    // 고정 잡지는 아래의 잡지 자동정렬 구역에서 한꺼번에 표시
    if (isFixedMagazine(row)) return;

    if (row.t === 'S') {
      const tr = document.createElement('tr');
      tr.className = 'section';
      const td = document.createElement('td');
      td.colSpan = 2 + COLS_PER_ROW;
      td.textContent = row.label;
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    // 배부용 잡지 마지막 위치에서 고정 잡지 + 추가 잡지를 연도순으로 합쳐 표시
    if (row.t === 'P' && row.label === MAG_LABEL) {
      const fixedItems = data.map((r, idx) => ({row:r, rIdx:idx, info:magazineInfo(r.name)}))
        .filter(x => isFixedMagazine(x.row) && x.info)
        .map(x => ({kind:'fixed', row:x.row, rIdx:x.rIdx, type:x.info.type, year:x.info.year, issue:x.info.issue}));
      const magExtras = extraRows.filter(ex => ex.afterIndex === magPlaceholderIndex).map(ex => ({
        kind:'extra', ex,
        type:savedAll['magType-'+ex.id] || '깨어라',
        year:parseInt(savedAll['magYear-'+ex.id] || '0',10) || 0,
        issue:parseInt(savedAll['magIssue-'+ex.id] || '0',10) || 0
      }));
      [...fixedItems, ...magExtras].sort(magSort).forEach(item => {
        if (item.kind === 'fixed') renderFixedRow(item.row, item.rIdx); else renderMagazineExtra(item.ex);
      });

      const addTr=document.createElement('tr'); addTr.className='add-row-btn';
      const addTd=document.createElement('td'); addTd.colSpan=2+COLS_PER_ROW;
      const note=document.createElement('span'); note.className='mag-add-note'; note.textContent='연도를 입력하면 오래된 연도부터 자동으로 정렬됩니다.';
      const btn=document.createElement('button'); btn.textContent='+ 깨어라/파수대 잡지 추가'; btn.onclick=()=>addExtraRow(rIdx);
      addTd.append(note, btn); addTr.appendChild(addTd); tbody.appendChild(addTr);
      return;
    }

    const hideOwnRow = row.t === 'P' && REMOVED_PLACEHOLDER_LABELS.includes(row.label);
    if (!hideOwnRow) {
      const tr = document.createElement('tr');
      const tdCode = document.createElement('td');
      tdCode.className = 'col-code';
      tdCode.textContent = row.code || '';
      tr.appendChild(tdCode);

      const tdName = document.createElement('td');
      tdName.className = 'col-name';
      if (row.t === 'P') {
        tr.className = 'placeholder';
        const nameInput = document.createElement('input');
        nameInput.placeholder = row.label;
        const key = 'name-' + rIdx;
        nameInput.value = savedAll[key] || '';
        nameInput.addEventListener('input', () => {
          const s = loadSaved();
          if (nameInput.value === '') delete s[key]; else s[key] = nameInput.value;
          saveSaved(s);
        });
        tdName.appendChild(nameInput);
      } else if (row.editableName) {
        const itemNameKey = 'itemName-' + rIdx;
        const itemNameInput = document.createElement('input');
        itemNameInput.className = 'item-name-input';
        itemNameInput.value = (savedAll[itemNameKey] !== undefined) ? savedAll[itemNameKey] : row.name;
        itemNameInput.addEventListener('input', () => {
          const s = loadSaved();
          if (itemNameInput.value === '') delete s[itemNameKey]; else s[itemNameKey] = itemNameInput.value;
          saveSaved(s);
        });
        tdName.appendChild(itemNameInput);
        if (row.abbr) {
          const ab = document.createElement('span');
          ab.className = 'abbr';
          ab.textContent = row.abbr;
          tdName.appendChild(ab);
        }
      } else {
        tdName.innerHTML = row.name + (row.abbr ? '<span class="abbr">' + row.abbr + '</span>' : '');
      }
      tr.appendChild(tdName);
      makeDataInputs(tr, 'r' + rIdx, row.values);
      tbody.appendChild(tr);
    }

    if (row.t === 'P') {
      extraRows.filter(ex => ex.afterIndex === rIdx).forEach(ex => {
        const exTr = document.createElement('tr');
        exTr.className = 'extra';
        const exTdCode = document.createElement('td'); exTdCode.className='col-code';
        const codeInput=document.createElement('input'); codeInput.placeholder='번호';
        const codeKey='extraCode-'+ex.id; codeInput.value=savedAll[codeKey] || '';
        codeInput.addEventListener('input',()=>{const s=loadSaved(); if(codeInput.value==='') delete s[codeKey]; else s[codeKey]=codeInput.value; saveSaved(s);});
        exTdCode.appendChild(codeInput); exTr.appendChild(exTdCode);

        const exTdName=document.createElement('td'); exTdName.className='col-name';
        const nameInput2=document.createElement('input'); nameInput2.placeholder='새 품목명 입력';
        const nameKey='extraName-'+ex.id; nameInput2.value=savedAll[nameKey] || '';
        const delBtn=document.createElement('button'); delBtn.textContent='✕'; delBtn.title='이 행 삭제'; delBtn.style.marginLeft='6px'; delBtn.onclick=()=>removeExtraRow(ex.id);
        // 품목명을 다 입력하면(빈칸이 아니면) 실수로 지우지 않도록 X 표시를 숨깁니다.
        delBtn.style.display = nameInput2.value.trim() ? 'none' : '';
        nameInput2.addEventListener('input',()=>{
          const s=loadSaved(); if(nameInput2.value==='') delete s[nameKey]; else s[nameKey]=nameInput2.value; saveSaved(s);
          delBtn.style.display = nameInput2.value.trim() ? 'none' : '';
        });
        exTdName.appendChild(nameInput2);
        exTdName.appendChild(delBtn); exTr.appendChild(exTdName);
        makeDataInputs(exTr,'extra-'+ex.id,null); tbody.appendChild(exTr);
      });

      const btnTr=document.createElement('tr'); btnTr.className='add-row-btn';
      const btnTd=document.createElement('td'); btnTd.colSpan=2+COLS_PER_ROW;
      const btn=document.createElement('button'); btn.textContent='+ 품목 추가'; btn.onclick=()=>addExtraRow(rIdx);
      btnTd.appendChild(btn); btnTr.appendChild(btnTd); tbody.appendChild(btnTr);
    }
  });
}


function saveNow() {
  // 현재 편집 중인 칸의 값까지 먼저 반영
  if (document.activeElement && typeof document.activeElement.blur === 'function') {
    document.activeElement.blur();
  }
  const yearInput = document.getElementById('ymYear');
  const cycle = document.getElementById('cycleSelect');
  if (yearInput) localStorage.setItem(YEAR_KEY, yearInput.value || '');
  if (cycle) localStorage.setItem(CYCLE_KEY, cycle.value || '9');

  // 각 입력칸은 입력할 때 자동 저장되며, 이 버튼은 저장 완료를 사용자에게 확인해 줍니다.
  alert('재고 수량과 깨어라·파수대의 연도, 호수, 제목이 저장되었습니다.');
}

function resetAll() {
  if (!confirm('모든 입력 값과 추가한 품목을 초기화하시겠습니까?')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(EXTRA_KEY);
  localStorage.removeItem(YEAR_KEY);
  setYearInput();
  buildTable();
}

function exportExcel() {
  const year = document.getElementById('ymYear').value || '';
  const months = CYCLES[cycleSelect.value];
  const monthLabels = months.map(m => m + '월');

  // 1) 상세 재고 조사표
  const aoa = [];
  aoa.push([(year ? year + '년 ' : '') + monthLabels[0] + ' 시작 재고 조사 목록']);
  aoa.push(['경주동부 회중', 'S-28-KO 양식 기준']);

  const monthHeaderRow = ['품목번호', '문헌'];
  monthLabels.forEach((label, idx) => {
    const span = idx === 0 ? 4 : 3;
    monthHeaderRow.push(label);
    for (let i = 1; i < span; i++) monthHeaderRow.push('');
  });
  aoa.push(monthHeaderRow);

  const subHeaderRow = ['', ''];
  monthLabels.forEach((label, idx) => {
    if (idx === 0) subHeaderRow.push('원재고', '입고', '현재고', '출고');
    else subHeaderRow.push('입고', '현재고', '출고');
  });
  aoa.push(subHeaderRow);

  const summaryRows = [];
  let currentSection = '';

  document.querySelectorAll('#tbody tr').forEach(tr => {
    if (tr.classList.contains('add-row-btn')) return;
    if (tr.classList.contains('section')) {
      currentSection = tr.textContent.trim();
      aoa.push([currentSection]);
      return;
    }

    const cells = Array.from(tr.querySelectorAll('td'));
    if (cells.length < 2) return;
    const codeInput = cells[0].querySelector('input');
    // 잡지 칸(mag-title/mag-extra-title/mag-year/mag-issue)은 아래에서 별도로 조합하므로,
    // 여기서는 순수한 "품목명" 입력칸만 골라야 제목이 두 번 겹쳐 붙는 것을 막을 수 있다.
    const nameInput = cells[1].querySelector('input:not(.mag-title):not(.mag-extra-title):not(.mag-year):not(.mag-issue)');
    const code = codeInput ? codeInput.value.trim() : cells[0].textContent.trim();
    let name = nameInput ? nameInput.value.trim() : (cells[1].childNodes[0]?.textContent?.trim() || cells[1].textContent.trim());
    const magTitleInput = cells[1].querySelector('.mag-title');
    if (magTitleInput && magTitleInput.value.trim()) {
      name += ' — ' + magTitleInput.value.trim();
    }
    const magTypeSel = cells[1].querySelector('.mag-extra-controls select');
    const magYearInput = cells[1].querySelector('.mag-year');
    const magIssueInput = cells[1].querySelector('.mag-issue');
    const magExtraTitle = cells[1].querySelector('.mag-extra-title');
    if (magTypeSel) {
      const y = magYearInput?.value.trim() || '';
      const i = magIssueInput?.value.trim() || '';
      name = magTypeSel.value + (y ? ' ' + y + '년' : '') + (i ? ' 제' + i + '호' : '');
      if (magExtraTitle && magExtraTitle.value.trim()) name += ' — ' + magExtraTitle.value.trim();
    }

    const rowArr = [code, name];
    const values = [];
    cells.slice(2).forEach(td => {
      const input = td.querySelector('input');
      const v = input ? input.value : td.textContent.trim();
      rowArr.push(v);
      values.push(v);
    });
    aoa.push(rowArr);

    if (name) {
      const currentIndexes = [2, 5, 8, 11, 14, 17]; // values 배열에서 각 월 현재고 위치
      let latestCurrent = '';
      let latestMonth = '';
      currentIndexes.forEach((idx, p) => {
        if (values[idx] !== undefined && values[idx] !== '') {
          latestCurrent = values[idx];
          latestMonth = monthLabels[p];
        }
      });
      const totalIn = [1,4,7,10,13,16].reduce((sum, idx) => sum + numOrZero(values[idx]), 0);
      const totalOut = [3,6,9,12,15,18].reduce((sum, idx) => sum + numOrZero(values[idx]), 0);
      summaryRows.push([currentSection, code, name, latestMonth, latestCurrent, totalIn, totalOut]);
    }
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = [];
  ws['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: 20 } });
  ws['!merges'].push({ s: { r: 1, c: 0 }, e: { r: 1, c: 20 } });

  let col = 2;
  monthLabels.forEach((label, idx) => {
    const span = idx === 0 ? 4 : 3;
    ws['!merges'].push({ s: { r: 2, c: col }, e: { r: 2, c: col + span - 1 } });
    col += span;
  });

  aoa.forEach((row, rIdx) => {
    if (rIdx >= 4 && row.length === 1) {
      ws['!merges'].push({ s: { r: rIdx, c: 0 }, e: { r: rIdx, c: 20 } });
    }
  });
  ws['!cols'] = [{ wch: 10 }, { wch: 60 }].concat(Array(19).fill({ wch: 10 }));
  ws['!autofilter'] = { ref: 'A4:U' + aoa.length };

  // 상세표 색상/테두리/정렬
  const thinBorder = {
    top:{style:'thin',color:{rgb:'B7C9DC'}}, bottom:{style:'thin',color:{rgb:'B7C9DC'}},
    left:{style:'thin',color:{rgb:'B7C9DC'}}, right:{style:'thin',color:{rgb:'B7C9DC'}}
  };
  const center = {horizontal:'center', vertical:'center'};
  // 문헌(제목) 칸: 글이 길어도(배부용 잡지 제목 등) 잘리지 않고 줄바꿈되어 전부 보이도록 wrapText 적용
  const left = {horizontal:'left', vertical:'center', wrapText:true};
  const currentCols = [4, 7, 10, 13, 16, 19]; // 현재고 칸 (열 인덱스, 품목번호/문헌 2칸 포함)
  for (let r = 0; r < aoa.length; r++) {
    for (let c = 0; c < 21; c++) {
      const addr = XLSX.utils.encode_cell({r,c});
      if (!ws[addr]) continue;
      const isCurrentCell = r >= 4 && currentCols.includes(c);
      ws[addr].s = {
        border: thinBorder,
        alignment: c === 1 ? left : center,
        font: isCurrentCell ? { color: { rgb: 'C00000' }, bold: true } : undefined
      };
    }
  }
  for (let c = 0; c < 21; c++) {
    const a0=XLSX.utils.encode_cell({r:0,c}); if(ws[a0]) ws[a0].s={fill:{fgColor:{rgb:'1F4E78'}},font:{bold:true,color:{rgb:'FFFFFF'},sz:14},alignment:center};
    const a1=XLSX.utils.encode_cell({r:1,c}); if(ws[a1]) ws[a1].s={fill:{fgColor:{rgb:'D9EAF7'}},font:{bold:true,color:{rgb:'1F1F1F'}},alignment:center,border:thinBorder};
    const a2=XLSX.utils.encode_cell({r:2,c}); if(ws[a2]) ws[a2].s={fill:{fgColor:{rgb:'5B9BD5'}},font:{bold:true,color:{rgb:'FFFFFF'}},alignment:center,border:thinBorder};
    const a3=XLSX.utils.encode_cell({r:3,c}); if(ws[a3]) {
      const isCurrent = [4,7,10,13,16,19].includes(c);
      ws[a3].s={fill:{fgColor:{rgb:isCurrent?'FFF2CC':'DDEBF7'}},font:{bold:true,color:{rgb:'1F1F1F'}},alignment:center,border:thinBorder};
    }
  }
  aoa.forEach((row, rIdx) => {
    if (rIdx >= 4 && row.length === 1) {
      const a=XLSX.utils.encode_cell({r:rIdx,c:0});
      if(ws[a]) ws[a].s={fill:{fgColor:{rgb:'A9D18E'}},font:{bold:true,color:{rgb:'1F1F1F'}},alignment:left,border:thinBorder};
    }
  });

  // 2) 현재 재고 요약표 — 엑셀을 열면 가장 먼저 보이도록 구성
  const summaryAoa = [
    [(year ? year + '년 ' : '') + '재고 현황 요약'],
    ['분류', '품목번호', '문헌', '최근 조사월', '현재고', '기간 총입고', '기간 총출고'],
    ...summaryRows
  ];
  const sws = XLSX.utils.aoa_to_sheet(summaryAoa);
  sws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }];
  sws['!cols'] = [
    { wch: 25 }, { wch: 10 }, { wch: 60 }, { wch: 12 },
    { wch: 12 }, { wch: 14 }, { wch: 14 }
  ];
  if (summaryRows.length) sws['!autofilter'] = { ref: 'A2:G' + (summaryRows.length + 2) };

  // 요약표 색상/테두리
  for (let r = 0; r < summaryAoa.length; r++) {
    for (let c = 0; c < 7; c++) {
      const addr = XLSX.utils.encode_cell({r,c});
      if (!sws[addr]) continue;
      let fill = 'FFFFFF', font = {color:{rgb:'222222'}};
      if (r === 0) { fill='1F4E78'; font={bold:true,color:{rgb:'FFFFFF'},sz:14}; }
      else if (r === 1) { fill='5B9BD5'; font={bold:true,color:{rgb:'FFFFFF'}}; }
      else if (c === 4) { fill='FFF2CC'; font={bold:true,color:{rgb:'C00000'}}; }
      else if (r % 2 === 0) { fill='F3F8FC'; }
      sws[addr].s={fill:{fgColor:{rgb:fill}},font,alignment:c===2?left:center,border:thinBorder};
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sws, '현재재고요약');
  XLSX.utils.book_append_sheet(wb, ws, '재고조사상세');
  XLSX.writeFile(wb, '재고_조사_목록_' + (year || '') + '.xlsx');
}
// ---- 연도 자동/수동 표시 ----
function setYearInput() {
  const yearInput = document.getElementById('ymYear');
  const savedYear = localStorage.getItem(YEAR_KEY);
  yearInput.value = savedYear || new Date().getFullYear();
  yearInput.addEventListener('input', () => {
    localStorage.setItem(YEAR_KEY, yearInput.value);
    scheduleCloudPush();
  });
}

// ---- 시작월(9월/3월) 선택에 따라 헤더 라벨 갱신 + 현재 월 강조 ----
function applyCycle(cycleKey) {
  const months = CYCLES[cycleKey];

  // 헤더 라벨을 실제 월(예: "9월")로 교체
  for (let i = 0; i < 6; i++) {
    document.getElementById('grp' + i).textContent = months[i] + '월';
  }

  // 기존 강조 초기화
  document.querySelectorAll('th.active-period').forEach(el => el.classList.remove('active-period'));

  const today = new Date().getMonth() + 1;
  const periodIdx = months.indexOf(today);

  const badge = document.getElementById('periodBadge');
  if (periodIdx === -1) {
    badge.textContent = '오늘은 ' + today + '월입니다 (현재 선택된 ' + months[0] + '월 조사 기간에 해당하지 않습니다)';
  } else {
    document.getElementById('grp' + periodIdx).classList.add('active-period');
    const subCount = (periodIdx === 0) ? 4 : 3;
    for (let i = 0; i < subCount; i++) {
      document.getElementById('sub' + periodIdx + '-' + i).classList.add('active-period');
    }
    badge.textContent = '오늘은 ' + today + '월입니다 → 현재 보고 열: ' + months[periodIdx] + '월 (파란색 열)';
  }
}

const cycleSelect = document.getElementById('cycleSelect');
const savedCycle = localStorage.getItem(CYCLE_KEY);
cycleSelect.value = savedCycle || '9';
cycleSelect.addEventListener('change', () => {
  localStorage.setItem(CYCLE_KEY, cycleSelect.value);
  applyCycle(cycleSelect.value);
  scheduleCloudPush();
});

setYearInput();
applyCycle(cycleSelect.value);
buildTable();
initCloudSync();

// ---- PWA: 서비스 워커 등록 + 홈 화면에 설치 ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('서비스 워커 등록 실패:', err);
    });
  });
}

let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (installBtn) installBtn.style.display = '';
});

function installApp() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(() => {
      deferredInstallPrompt = null;
      if (installBtn) installBtn.style.display = 'none';
    });
    return;
  }
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS) {
    alert('iOS(Safari)에서 앱으로 설치하려면:\n\n1) 하단 공유 아이콘(⬆️)을 누르세요\n2) "홈 화면에 추가"를 선택하세요');
  } else {
    alert('이 브라우저에서는 자동 설치 버튼을 지원하지 않습니다.\n브라우저 메뉴(⋮)에서 "홈 화면에 추가" 또는 "앱 설치"를 선택해 주세요.');
  }
}

// 이미 설치되어 있으면(standalone 모드) 설치 버튼을 숨김
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
  if (installBtn) installBtn.style.display = 'none';
}

// 비-iOS 브라우저에서 beforeinstallprompt가 아직 안 왔어도 설치 버튼은 보여주고,
// 눌렀을 때 안내 메시지로 대체 처리(위 installApp 참고)
if (installBtn && !/iphone|ipad|ipod/i.test(navigator.userAgent)) {
  installBtn.style.display = '';
}
</script>
